name: Hola mundo, Gabriel
on: 
   push:
   workflow_dispatch:
      inputs:
       saludo:
         type: choice
         options: [Hola, buenos dias que tal]
jobs:
   saludar:
    runs-on: codespaces-prebuild
    steps:
       - uses: actions/checkout@v4
       - run: echo "Hola $({ github.actor }), comit $({ github.sha })"
       - run: 'echo "Elegiste: $({ inputs.saludo })"'
